services:
  - type: web
    name: wasel-nalut-backend
    env: node
    region: frankfurt
    plan: free
    repo: https://github.com/kalifakatoos/wasel-nalut
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MASTER_ADMIN_PIN
        value: 7788
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
